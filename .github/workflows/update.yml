name: update menu

on:
  schedule:
    - cron: "0 22,1,4,8 * * *"   # KST 07, 10, 13, 17시
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tests/test_parse.py
      - run: python fetch_menu.py
      - name: commit if changed
        run: |
          git diff --quiet data/menu.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/menu.json
          git commit -m "chore: update menu"
          git push
