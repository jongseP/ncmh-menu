<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘의 직원 식단</title>
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --accent:#3182f6; --text:#191f28; --sub:#8b95a1; --chip:#f4f6f8; --line:#eef0f3; }
  * { box-sizing:border-box; }
  body { margin:0; background:#fff; color:var(--text); font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif; letter-spacing:-.3px; }
  main { max-width:480px; margin:0 auto; padding:28px 24px 130px; }
  .pill { display:inline-flex; align-items:center; gap:6px; background:#eef5ff; color:var(--accent); font-size:13px; font-weight:600; padding:6px 11px; border-radius:20px; }
  .pill i { width:6px; height:6px; border-radius:50%; background:var(--accent); }
  .date { font-size:15px; color:var(--sub); margin-top:16px; font-weight:500; }
  .hello { font-size:30px; font-weight:700; margin:6px 0 28px; line-height:1.32; word-break:keep-all; }
  .hello em { font-style:normal; background:linear-gradient(transparent 62%,#d6e7ff 62%); }
  .lbl { font-size:13px; color:var(--sub); font-weight:600; margin-bottom:10px; }
  .chips { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:22px; }
  .chip { background:var(--chip); border-radius:10px; padding:8px 12px; font-size:15px; color:#333d4b; }
  .chip.rice { background:#fff8e6; color:#8a6100; }
  .duo { display:flex; gap:10px; }
  .duo div { flex:1; border:1px solid var(--line); border-radius:14px; padding:12px 14px; min-width:0; }
  .duo small { display:block; font-size:12px; color:var(--sub); font-weight:600; margin-bottom:2px; }
  .duo span { font-size:15px; font-weight:600; word-break:keep-all; }
  .empty { text-align:center; padding:80px 0 0; color:var(--sub); font-size:16px; line-height:1.6; }
  .empty b { display:block; color:var(--text); font-size:20px; margin-bottom:6px; }
  footer { margin-top:36px; font-size:12px; color:var(--sub); line-height:1.7; word-break:keep-all; }
  a { color:var(--accent); text-decoration:none; }
  nav { position:fixed; left:0; right:0; bottom:0; padding:0 12px calc(14px + env(safe-area-inset-bottom)); background:linear-gradient(transparent,#fff 30%); }
  .wk { max-width:456px; margin:0 auto; }
  .wkhead { display:flex; justify-content:space-between; font-size:13px; padding:0 8px 6px; min-height:24px; }
  .wkhead button { background:none; border:0; color:var(--accent); font:inherit; font-weight:600; padding:4px 0; cursor:pointer; }
  .bar { display:flex; justify-content:space-between; padding:8px; background:var(--chip); border-radius:24px; }
  .bar button { width:38px; height:38px; border-radius:50%; border:0; background:none; font:inherit; font-size:14px; color:var(--sub); font-weight:500; cursor:pointer; }
  .bar button.today { color:var(--accent); font-weight:700; }
  .bar button.on { background:var(--text); color:#fff; font-weight:700; }
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav" hidden><div class="wk"><div class="wkhead" id="wkhead"></div><div class="bar" id="bar"></div></div></nav>
<script src="logic.js"></script>
<script>
const NOTICE = "https://www.ncmh.go.kr/ncmh/board/boardList.do?fno=37&menu_cd=01_01";
const DOW = ["일","월","화","수","목","금","토"];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function seoulNow() {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA", {timeZone:"Asia/Seoul", year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hourCycle:"h23"}).formatToParts(new Date()).map(x => [x.type, x.value]));
  const iso = `${p.year}-${p.month}-${p.day}`;
  const dow = new Date(iso + "T00:00:00Z").getUTCDay();
  return { iso, hhmm:`${p.hour}:${p.minute}`, weekend: dow === 0 || dow === 6 };
}
const dowOf = iso => new Date(iso + "T00:00:00Z").getUTCDay();
const md = iso => `${+iso.slice(5,7)}월 ${+iso.slice(8,10)}일`;

let data = null, wi = 0, sel = null;
const now = seoulNow();

function emptyView(msg) {
  document.getElementById("app").innerHTML =
    `<div class="empty"><b>${msg}</b>목요일쯤 다음 주 식단이 올라와요.<br><a href="${NOTICE}">센터 공지사항 보기 ›</a></div>`;
}

function render() {
  const week = data.weeks[wi];
  const day = week.days.find(d => d.date === sel);
  const isToday = sel === now.iso;
  const status = isToday ? statusText(now, week.hours) : null;
  const who = isToday ? "오늘" : DOW[dowOf(sel)] + "요일";
  const main = day.main.length ? day.main.map(esc).join("<br>") : "메뉴 없음";
  const chips = (day.rice ? `<span class="chip rice">${esc(day.rice)}</span>` : "") + day.sides.map(s => `<span class="chip">${esc(s)}</span>`).join("");
  const duo = [["PLUS 코너", day.plus], ["TAKE OUT", day.takeout]].filter(x => x[1]).map(([k, v]) => `<div><small>${k}</small><span>${esc(v)}</span></div>`).join("");
  const up = new Date(data.updated);
  document.getElementById("app").innerHTML = `
    ${status ? `<span class="pill"><i></i>${status}</span>` : ""}
    <div class="date">${md(sel)} ${DOW[dowOf(sel)]}요일</div>
    <div class="hello">${who} 점심은<br><em>${main}</em></div>
    ${chips ? `<div class="lbl">밥 · 국 및 반찬</div><div class="chips">${chips}</div>` : ""}
    ${duo ? `<div class="duo">${duo}</div>` : ""}
    <footer>중식 평일 ${week.hours.lunch_weekday} · 주말 ${week.hours.lunch_weekend} · 석식 ${week.hours.dinner} (같은 메뉴)<br>
      식단은 사정에 따라 바뀔 수 있어요 · <a href="${NOTICE}">원문 공지</a><br>
      마지막 확인 ${up.toLocaleString("ko-KR", {timeZone:"Asia/Seoul", month:"long", day:"numeric", hour:"2-digit", minute:"2-digit"})}</footer>`;

  document.getElementById("wkhead").innerHTML =
    `<span>${wi > 0 ? `<button data-w="${wi-1}">‹ 이전 주</button>` : ""}</span><span>${wi < data.weeks.length-1 ? `<button data-w="${wi+1}">다음 주 ›</button>` : ""}</span>`;
  document.getElementById("bar").innerHTML = week.days.map(d =>
    `<button data-d="${d.date}" class="${d.date === sel ? "on" : ""} ${d.date === now.iso ? "today" : ""}" aria-label="${md(d.date)}">${DOW[dowOf(d.date)]}</button>`).join("");
  document.getElementById("nav").hidden = false;
}

document.getElementById("nav").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.d) sel = b.dataset.d;
  if (b.dataset.w) { wi = +b.dataset.w; sel = data.weeks[wi].days[0].date; }
  render();
  scrollTo(0, 0);
});

fetch("data/menu.json", {cache:"no-cache"}).then(r => r.ok ? r.json() : Promise.reject()).then(d => {
  data = d;
  const hit = findDay(d.weeks, now.iso);
  if (hit) { wi = d.weeks.indexOf(hit.week); sel = now.iso; }
  else {
    const next = d.weeks.findIndex(w => w.days[0].date > now.iso);
    if (next < 0) return emptyView("아직 이번 주 식단이 올라오지 않았어요");
    wi = next; sel = d.weeks[next].days[0].date;
  }
  render();
}).catch(() => emptyView("아직 이번 주 식단이 올라오지 않았어요"));
</script>
</body>
</html>
